name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo build --locked
      - run: cargo test --locked
      - run: cargo run --locked -- verify
      - run: cargo clippy --locked -- -D warnings

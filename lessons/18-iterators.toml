id = "18-iterators"
order = 18
chapter = "Superpowers"
title = "The Conveyor Belt"
xp = 110
concepts = ["iter", "map", "filter", "sum", "count", "collect", "enumerate", "copied", "chaining"]

intro = '''
# Iterators: a conveyor belt of values

Instead of a `for` loop with a counter and a pile of `mut` variables, you can put your items on a conveyor belt and add machines along it. Each machine changes or removes items. At the end, something collects the result.

iterator :: something that hands out items one at a time
adapter :: a belt machine like `map` or `filter` that returns a new iterator
consumer :: the end of the belt, like `sum` or `collect`, that produces a final answer
---
Start the belt with `.iter()`, add machines, finish with a consumer.

```rust
let nums = vec![1, 2, 3, 4, 5, 6];

let total: i32 = nums.iter().sum();            // 21
let how_many = nums.iter().count();            // 6
let doubled: Vec<i32> = nums.iter().map(|x| x * 2).collect();
// [2, 4, 6, 8, 10, 12]
```

`map` changes every item using a closure. `collect` gathers the items into a new `Vec`. Nothing happens until a consumer runs, because iterators are lazy.
---
`filter` keeps only the items the closure says `true` for. Add `.copied()` first so the closure sees plain numbers instead of references.

```rust
let big: Vec<i32> = nums
    .iter()
    .copied()
    .filter(|x| *x > 3)
    .map(|x| x * 10)
    .collect();
// [40, 50, 60]
```

Chain as many machines as you like. Read it top to bottom like a recipe.

filter :: keep only items where the closure returns true
enumerate :: pairs each item with its index: `(0, "a"), (1, "b")`
---
The same job both ways:

```rust
// for loop
let mut total = 0;
for n in &nums {
    if n % 2 == 0 {
        total += n * n;
    }
}

// iterator chain
let total: i32 = nums.iter().copied().filter(|n| n % 2 == 0).map(|n| n * n).sum();
```

`enumerate` is perfect when you need positions: `names.iter().enumerate().map(|(i, s)| format!("{i}:{s}"))`.

> Pinch tip: when a chain stops compiling, add a type like `let x: Vec<i32> = ...` to see what the compiler expects.
'''

goal = "Rewrite the loops as iterator chains: sum_of_squares, count_big (items over 10), evens_doubled, and labelled (index:name). No `for` loops allowed!"

starter = '''
// Sum of every number squared. sum_of_squares(&[1, 2, 3]) is 14.
fn sum_of_squares(v: &[i32]) -> i32 {
    todo!()
}

// How many numbers are greater than 10?

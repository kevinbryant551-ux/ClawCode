    todo!()
}

fn main() {
    println!("{}", sum_of_squares(&[1, 2, 3]));
    println!("{}", count_big(&[5, 15, 25]));
    println!("{:?}", evens_doubled(&[1, 2, 3, 4]));
    println!("{:?}", labelled(&["a", "b"]));
}
'''

solution = '''
fn sum_of_squares(v: &[i32]) -> i32 {
    v.iter().map(|x| x * x).sum()
}

fn count_big(v: &[i32]) -> usize {
    v.iter().filter(|x| **x > 10).count()
}

fn evens_doubled(v: &[i32]) -> Vec<i32> {
    v.iter().copied().filter(|x| x % 2 == 0).map(|x| x * 2).collect()
}

fn labelled(names: &[&str]) -> Vec<String> {
    names
        .iter()
        .enumerate()
        .map(|(i, s)| format!("{}:{}", i, s))
        .collect()
}

fn main() {
    println!("{}", sum_of_squares(&[1, 2, 3]));
    println!("{}", count_big(&[5, 15, 25]));
    println!("{:?}", evens_doubled(&[1, 2, 3, 4]));
    println!("{:?}", labelled(&["a", "b"]));
}
'''

hints = [
  "Every answer starts with `v.iter()` (or `names.iter()`). Then add machines with dots, and end with a consumer like `.sum()`, `.count()` or `.collect()`.",
  "`sum_of_squares` is `.map(|x| x * x).sum()`. For `count_big`, use `.copied().filter(|x| *x > 10).count()`. For `evens_doubled`, filter with `x % 2 == 0`, then map `x * 2`, then `.collect()`.",
  "`labelled` is `names.iter().enumerate().map(|(i, s)| format!(\"{}:{}\", i, s)).collect()`. The `(i, s)` pattern unpacks the index and the name.",
]

success = "Belt running smoothly! `.iter()` starts the line, `map` and `filter` reshape it, `enumerate` adds indexes, and `sum`, `count` or `collect` finish the job. Clean and loop-free!"

[check]
tests = '''
#[test]
fn squares_add_up() {
    assert_eq!(sum_of_squares(&[1, 2, 3]), 14, "1 + 4 + 9 should be 14");
    assert_eq!(sum_of_squares(&[]), 0, "an empty list should sum to 0");
}

#[test]
fn counts_big_numbers() {
    assert_eq!(count_big(&[5, 15, 25]), 2, "15 and 25 are over 10, so the count is 2");
    assert_eq!(count_big(&[10, 1]), 0, "10 is not greater than 10");
}

#[test]
fn evens_are_doubled() {
    assert_eq!(evens_doubled(&[1, 2, 3, 4]), vec![4, 8], "evens 2 and 4 doubled should be [4, 8]");
    assert_eq!(evens_doubled(&[1, 3]), Vec::<i32>::new(), "no evens should give an empty Vec");
}

#[test]
fn labels_use_indexes() {
    assert_eq!(labelled(&["a", "b"]), vec!["0:a", "1:b"], "labelled should give [\"0:a\", \"1:b\"]");
    assert_eq!(labelled(&[]), Vec::<String>::new(), "no names should give an empty Vec");
}

'''


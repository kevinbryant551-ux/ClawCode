'''
choices = ["10", "14", "4", "2, 3, 4, 5"]
answer = 1
explain = "map turns 1,2,3,4 into 2,3,4,5 and sum adds them: 14. The original 10 would be the sum without map."

[[quiz]]
after_card = 3
question = "You write `nums.iter().map(|x| x * 2);` and never call sum, count or collect. What happens?"
choices = ["It doubles all the numbers in nums", "Nothing is computed, because iterators are lazy until a consumer runs", "It prints the doubled numbers", "It panics at runtime"]
answer = 1
explain = "Adapters like map just describe the work. A consumer at the end of the belt is what actually runs it."


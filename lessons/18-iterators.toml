text = ".iter()"
why = "Start your chains with `.iter()`."

[[check.must_not_contain]]
text = "for "
why = "Not this time! Practice the iterator chain instead of a `for` loop: start with `.iter()` and finish with `.sum()`, `.count()` or `.collect()`."


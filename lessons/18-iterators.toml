    todo!()
}

// Keep only the even numbers, then double them.
// evens_doubled(&[1, 2, 3, 4]) is [4, 8].
fn evens_doubled(v: &[i32]) -> Vec<i32> {
    todo!()
}

// Turn names into "index:name" text.
// labelled(&["a", "b"]) is ["0:a", "1:b"].

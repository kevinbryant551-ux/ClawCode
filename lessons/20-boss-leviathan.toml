[check]
tests = '''
#[test]
fn hero_is_built() {
    let h = Hero::new("Pinch");
    assert_eq!(h.name, "Pinch", "Hero::new should store the name");
    assert_eq!(h.hp, 30, "a new hero should have 30 hp");
}

#[test]
fn banner_uses_the_title() {
    let h = Hero::new("Pinch");
    assert_eq!(h.title(), "Pinch", "a hero's title is its name");
    assert_eq!(h.banner(), "=== Pinch ===", "the default banner should be \"=== TITLE ===\"");
}

#[test]
fn damage_values() {
    assert_eq!(damage(&Move::Claw), 5, "Claw does 5");
    assert_eq!(damage(&Move::Pinch(4)), 8, "Pinch(4) does 8");
    assert_eq!(damage(&Move::Retreat), 0, "Retreat does 0");
}

#[test]
fn total_damage_adds_up() {
    let moves = vec![Move::Claw, Move::Pinch(4), Move::Retreat, Move::Pinch(10)];
    assert_eq!(total_damage(&moves), 33, "5 + 8 + 0 + 20 should be 33");
    assert_eq!(total_damage(&[]), 0, "no moves means no damage");
}

#[test]
fn big_hits_are_counted() {
    let moves = vec![Move::Claw, Move::Pinch(5), Move::Pinch(10), Move::Retreat];
    assert_eq!(count_big_hits(&moves), 2, "Pinch(5) and Pinch(10) do 10 or more");
}

#[test]
fn parse_move_works() {
    assert_eq!(damage(&parse_move("claw").unwrap()), 5, "\"claw\" should parse to Claw");
    assert_eq!(damage(&parse_move("retreat").unwrap()), 0, "\"retreat\" should parse to Retreat");
    assert_eq!(damage(&parse_move("pinch 4").unwrap()), 8, "\"pinch 4\" should parse to Pinch(4)");
}

#[test]
fn parse_move_rejects_nonsense() {
    assert!(parse_move("dance").is_err(), "\"dance\" is not a move");
    assert!(parse_move("pinch abc").is_err(), "\"pinch abc\" has no valid power");
}

#[test]
fn parse_battle_reads_scripts() {
    let moves = parse_battle("claw, pinch 4, retreat").unwrap();
    assert_eq!(moves.len(), 3, "the script has three moves");
    assert_eq!(total_damage(&moves), 13, "5 + 8 + 0 should be 13");
    assert!(parse_battle("claw, dance").is_err(), "one bad move should make the whole battle an Err");
}
'''


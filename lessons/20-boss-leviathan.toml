solution = '''
struct Hero {
    name: String,
    hp: u32,
}

impl Hero {
    fn new(name: &str) -> Hero {
        Hero { name: name.to_string(), hp: 30 }
    }
}

trait Describe {
    fn title(&self) -> String;

    fn banner(&self) -> String {
        format!("=== {} ===", self.title())
    }
}

impl Describe for Hero {
    fn title(&self) -> String {
        self.name.clone()
    }
}

enum Move {
    Claw,
    Pinch(u32),
    Retreat,
}

fn damage(m: &Move) -> u32 {
    match m {
        Move::Claw => 5,
        Move::Pinch(n) => n * 2,
        Move::Retreat => 0,
    }
}

fn total_damage(moves: &[Move]) -> u32 {
    moves.iter().map(|m| damage(m)).sum()
}

fn count_big_hits(moves: &[Move]) -> usize {
    moves.iter().filter(|m| damage(m) >= 10).count()
}

fn parse_move(text: &str) -> Result<Move, String> {
    let text = text.trim();
    if text == "claw" {
        return Ok(Move::Claw);
    }
    if text == "retreat" {
        return Ok(Move::Retreat);
    }
    if let Some(rest) = text.strip_prefix("pinch ") {
        return match rest.trim().parse::<u32>() {
            Ok(n) => Ok(Move::Pinch(n)),
            Err(_) => Err(format!("bad pinch power: {}", rest)),
        };
    }
    Err(format!("unknown move: {}", text))
}

fn parse_battle(script: &str) -> Result<Vec<Move>, String> {
    let mut moves = Vec::new();
    for piece in script.split(',') {
        let m = parse_move(piece)?;
        moves.push(m);
    }
    Ok(moves)
}

fn main() {
    let hero = Hero::new("Pinch");
    println!("{}", hero.banner());
    match parse_battle("claw, pinch 4, retreat") {
        Ok(moves) => println!("Damage: {}", total_damage(&moves)),
        Err(e) => println!("Bad script: {}", e),
    }
}
'''


text = "|"
why = "Write a closure with bars, like `|s| s + bonus`, inside score_with_bonus."

[[quiz]]
after_card = 2
question = '''
What does this print?
```rust
let add = |a, b| a + b;
println!("{}", add(2, 3));
```
'''
choices = ["23", "5", "add", "Nothing, closures cannot be stored"]
answer = 1
explain = "A closure is called like a function. `add(2, 3)` runs `a + b` and gives 5."

[[quiz]]
after_card = 3
question = '''
What does this print?
```rust
let n = 10;
let f = |x| x + n;
println!("{}", f(1));
```
'''
choices = ["1", "10", "11", "It does not compile because n was not passed in"]
answer = 2
explain = "The closure captured `n` from its surroundings, so f(1) is 1 + 10 = 11."


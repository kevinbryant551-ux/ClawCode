solution = '''
struct Crab {
    name: String,
    shells: u32,
}

impl Crab {
    fn new(name: &str) -> Crab {
        Crab {
            name: name.to_string(),
            shells: 0,
        }
    }

    fn collect(&mut self, n: u32) {
        self.shells += n;
    }

    fn is_rich(&self) -> bool {
        self.shells >= 10
    }
}

fn main() {
    let mut pinch = Crab::new("Pinch");
    pinch.collect(12);
    println!("{} has {} shells. Rich? {}", pinch.name, pinch.shells, pinch.is_rich());
}
'''

hints = [
  "Start with `new`. You need to return a `Crab { ... }` and give a value to both fields, `name` and `shells`.",
  "For the name field, a `&str` must become a `String`: write `name: name.to_string()`. Start `shells` at `0`.",
  "`collect` is `self.shells += n;` and `is_rich` is just the comparison `self.shells >= 10` with no semicolon, so it is returned.",
]

success = "Shell-ebration time! You made your own type: a struct holds named fields, and an impl block gives it an associated function (new) plus methods that read (&self) or change (&mut self) it."

[check]
tests = '''
#[test]
fn new_crab_starts_empty() {
    let c = Crab::new("Sandy");
    assert_eq!(c.name, "Sandy", "Crab::new should store the name it was given");
    assert_eq!(c.shells, 0, "a new crab should start with 0 shells");
}

#[test]
fn collect_adds_shells() {
    let mut c = Crab::new("Sandy");
    c.collect(3);
    c.collect(4);
    assert_eq!(c.shells, 7, "collecting 3 then 4 should give 7 shells");
}

#[test]
fn poor_crab_is_not_rich() {
    let mut c = Crab::new("Sandy");
    c.collect(9);
    assert!(!c.is_rich(), "9 shells is not rich yet");
}

#[test]
fn ten_shells_is_rich() {
    let mut c = Crab::new("Sandy");
    c.collect(10);
    assert!(c.is_rich(), "10 shells should count as rich");
}
'''

[[quiz]]
after_card = 2
question = '''
Using the Fish code, which line builds a new Fish?
'''
choices = ["`Fish::new(\"Bubbles\")`", "`f.new(\"Bubbles\")`", "`new.Fish(\"Bubbles\")`", "`Fish.new(\"Bubbles\")`"]
answer = 0
explain = "`new` has no `self`, so it is an associated function and you call it with `::` on the type name."

[[quiz]]
after_card = 3
question = '''
Does this compile? (`grow` takes `&mut self`)
```rust
let f = Fish::new("Bubbles");
f.grow(5);
```
'''
choices = ["Yes", "No: f must be declared `let mut f`", "No: grow is private", "No: Fish::new returns the wrong type"]
answer = 1
explain = "A `&mut self` method changes the value, so the variable has to be `mut`. Rust reports E0596."

[[quiz]]
after_card = 3
question = '''
What does this print?
```rust
let mut f = Fish::new("Bubbles");
f.grow(20);
f.grow(15);
println!("{}", f.is_big());
```
'''
choices = ["false", "true", "36", "It does not compile"]
answer = 1
explain = "The length starts at 1, then 1 + 20 + 15 = 36. That is more than 30, so is_big gives true."


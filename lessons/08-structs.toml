id = "08-structs"
order = 8
chapter = "Building Your Own Types"
title = "Build a Crab"
xp = 90
concepts = ["struct", "fields", "impl", "methods", "&self", "&mut self", "associated function"]

intro = '''
# Make your own type

So far you have used types Rust gave you, like `i32` and `String`. Now you get to invent your own!

A **struct** bundles several values into one thing, and each value gets a name.

struct :: a custom type made of named pieces of data
field :: one named piece inside a struct
impl :: a block where you attach functions to a type
method :: a function that works on one particular value; you call it with a dot
associated function :: a function in an `impl` block that has no `self`; you call it with `::`

---
Here is a tiny example about a fish:

```rust
struct Fish {
    name: String,
    length: u32,
}

impl Fish {
    // associated function: builds a new Fish
    fn new(name: &str) -> Fish {
        Fish { name: name.to_string(), length: 1 }
    }

    // method: only reads (&self)
    fn is_big(&self) -> bool {
        self.length > 30
    }

    // method: changes the fish (&mut self)
    fn grow(&mut self, cm: u32) {
        self.length += cm;
    }
}

fn main() {
    let mut f = Fish::new("Bubbles");
    f.grow(40);
    println!("{} is {} cm", f.name, f.length);
}
```

---
Notice a few things:

- You read a field with a dot: `f.length`.
- `&self` means "borrow me to look". `&mut self` means "borrow me to change", so the variable must be `let mut`.
- Inside a method, `self` is the value itself, so you write `self.length`.
- `Fish::new(...)` uses `::` because `new` has no `self`.

> Pinch tip: `new` is not a special keyword. It is just a popular name for "build me one of these". Nice and tidy!
'''


intro = '''
# Two kinds of text

You have met both already, but let's make it stick.

String :: owned text that lives in a variable and can grow
&str :: a borrowed view of text, like a literal `"hello"`
push_str :: adds more text onto the end of a `String`
format! :: builds a new `String` from pieces, like `println!` without printing

Rule of thumb: **take `&str` as input, give back `String` as output**. A `&str` parameter accepts both literals and borrowed Strings.
---
Building text:

```rust
let mut s = String::from("Ahoy");
s.push_str(", crab");
s.push('!');                       // one char uses push
let msg = format!("{s} x{}", 3);   // "Ahoy, crab! x3"
println!("{}", msg.len());         // 14
```

`len()` counts **bytes**, which equals letters for plain English text.

A function that changes a String must borrow it mutably: `fn add_bang(s: &mut String) { s.push('!'); }`.

> Pinch tip: `"abc" + "def"` does not work in Rust. Use `format!` to glue text together instead.
---
Asking questions about text. These methods work on `&str` and `String`:

```rust
let t = "  big red crab  ";
t.trim();                    // "big red crab"
t.contains("red");           // true
t.to_uppercase();            // "  BIG RED CRAB  " (a new String)
t.split_whitespace().count() // 3 words
```

trim :: removes spaces from both ends
split_whitespace :: cuts text into words, ignoring extra spaces; use it in a `for` loop or call `.count()`
---
Letter by letter, use `.chars()` in a loop:

```rust
let mut e = 0;
for ch in "seashell".chars() {
    if ch == 'e' {
        e += 1;
    }
}
// e is 2
```

chars :: gives you each character one at a time

Single characters use single quotes (`'e'`), text uses double quotes (`"e"`).

Methods like `to_uppercase()` and `trim()` don't change the original. They give you something new.
'''

goal = "Implement shout, count_vowels, word_count, banner and add_ahoy so the tests pass."

starter = '''

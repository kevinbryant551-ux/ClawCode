# Borrowzilla rises from the tide pool!

A giant monster guards the tide pool, and the only way past is to finish its **inventory** of sea creatures. Every passing test knocks one HP off the boss.

You already know every tool you need:

- `struct` and `enum` hold the data (already defined for you)
- `match` picks an answer based on the enum
- `Option` says "maybe there is a value"
- `for` loops repeat work
- `&` and `&mut` borrow instead of taking ownership

Read the comments in the starter, then fill in each `todo!()`.

> Pinch tip: if a test fails, read its message. It tells you exactly what the boss expected. Beat him one function at a time!
'''


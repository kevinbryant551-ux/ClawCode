solution = '''
#[derive(Debug, PartialEq)]
enum Kind {
    Crab,
    Starfish,
    Snail,
}

struct Creature {
    name: String,
    kind: Kind,
    size: u32,
}

fn points(kind: &Kind) -> u32 {
    match kind {
        Kind::Crab => 5,
        Kind::Starfish => 3,
        Kind::Snail => 1,
    }
}

fn kind_from_letter(letter: char) -> Option<Kind> {
    match letter {
        'c' => Some(Kind::Crab),
        's' => Some(Kind::Starfish),
        'n' => Some(Kind::Snail),
        _ => None,
    }
}

fn pile_score(kind: &Kind, count: u32) -> u32 {
    let mut total = 0;
    for _ in 0..count {
        total += points(kind);
    }
    total
}

fn grow(creature: &mut Creature) {
    creature.size += 1;
}

fn label(creature: &Creature) -> String {
    format!("{} (size {})", creature.name, creature.size)
}

fn rename(creature: &mut Creature, new_name: &str) {
    creature.name = new_name.to_string();
}

fn main() {
    let mut c = Creature { name: String::from("Pinch"), kind: Kind::Crab, size: 3 };
    grow(&mut c);
    println!("{} worth {}", label(&c), points(&c.kind));
}
'''

hints = [
  "Take the functions top to bottom. `points` and `kind_from_letter` are both `match`. The second one needs a final `_ => None` arm for every other letter.",
  "`kind_from_letter` returns `Some(Kind::Crab)` for 'c' and so on. `pile_score` needs `let mut total = 0;`, then `for _ in 0..count { total += points(kind); }`, then `total` on its own line at the end.",
  "`grow` is `creature.size += 1;`. `label` is `format!(\"{} (size {})\", creature.name, creature.size)`. `rename` is `creature.name = new_name.to_string();` because a `&str` must become an owned `String`.",
]

success = "Borrowzilla is toast! You mixed a struct, an enum with match, an Option, a loop and both kinds of borrow in one program. Chapter one complete, crab commander!"


[check]
tests = '''
#[test]
fn points_for_each_kind() {
    assert_eq!(points(&Kind::Crab), 5, "a Crab is worth 5 points");
    assert_eq!(points(&Kind::Starfish), 3, "a Starfish is worth 3 points");
    assert_eq!(points(&Kind::Snail), 1, "a Snail is worth 1 point");
}

#[test]
fn letter_c_is_a_crab() {
    assert_eq!(kind_from_letter('c'), Some(Kind::Crab), "'c' should give Some(Kind::Crab)");
    assert_eq!(kind_from_letter('s'), Some(Kind::Starfish), "'s' should give Some(Kind::Starfish)");
    assert_eq!(kind_from_letter('n'), Some(Kind::Snail), "'n' should give Some(Kind::Snail)");
}

#[test]
fn unknown_letter_is_none() {
    assert_eq!(kind_from_letter('z'), None, "'z' is not a creature, so expect None");
}

#[test]
fn pile_of_crabs() {
    assert_eq!(pile_score(&Kind::Crab, 4), 20, "4 crabs at 5 points each is 20");
}

#[test]
fn empty_pile_scores_zero() {
    assert_eq!(pile_score(&Kind::Starfish, 0), 0, "a pile of 0 creatures scores 0");
    assert_eq!(pile_score(&Kind::Snail, 3), 3, "3 snails at 1 point each is 3");
}

#[test]
fn grow_and_label() {
    let mut c = Creature { name: String::from("Pinch"), kind: Kind::Crab, size: 3 };
    assert_eq!(label(&c), "Pinch (size 3)", "label should look like \"Pinch (size 3)\"");
    grow(&mut c);
    grow(&mut c);
    assert_eq!(c.size, 5, "two grows should take size 3 to 5");
    assert_eq!(label(&c), "Pinch (size 5)", "label should show the new size");
}

#[test]
fn rename_changes_name() {
    let mut c = Creature { name: String::from("Pinch"), kind: Kind::Snail, size: 1 };
    rename(&mut c, "Goo");
    assert_eq!(c.name, "Goo", "rename should replace the creature's name");
    assert_eq!(c.size, 1, "rename should not touch the size");
}
'''

[[quiz]]
after_card = 1
question = '''
Which function signature lets a function change a `Creature` without taking ownership of it?
'''
choices = [
  "fn grow(c: Creature)",
  "fn grow(c: &Creature)",
  "fn grow(c: &mut Creature)",
  "fn grow(mut c: Creature)",
]
answer = 2
explain = "`&mut Creature` borrows the value for changing. `&Creature` only lets you look, and plain `Creature` would move it into the function."


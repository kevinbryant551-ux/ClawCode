intro = '''
# A notebook with labels

A Vec finds things by position. A **HashMap** finds things by **name**, like a notebook where each page has a label.

HashMap :: a collection of key and value pairs; look up a value by its key
key :: the label you search with, like `"pearl"`
value :: the data stored under that key, like `3`
use :: brings a type from the standard library into your code

HashMap lives outside the default toolbox, so add this line at the top of your file:

```rust
use std::collections::HashMap;
```
---
Making and reading one:

```rust
let mut shells: HashMap<String, u32> = HashMap::new();
shells.insert(String::from("pearl"), 3);
shells.insert(String::from("conch"), 1);

match shells.get("pearl") {
    Some(n) => println!("{n} pearls"),
    None => println!("no pearls"),
}
```

`insert` adds a pair (or replaces an old value with the same key). `get` returns an `Option<&u32>`, because the key might not be there. That is the same safe idea as `Vec::get`.

> Pinch tip: `get("pearl")` takes a `&str`, so you do not have to build a new String just to look something up.
---
**Counting trick!** To count things you need "start at 0 if new, then add 1". The `entry` method does exactly that:

```rust
let mut counts: HashMap<String, u32> = HashMap::new();
for word in "a b a".split_whitespace() {
    let c = counts.entry(word.to_string()).or_insert(0);
    *c += 1;
}
// a: 2, b: 1
```

entry :: asks "is this key already here?"
or_insert :: if the key is missing, store this starting value; either way, hand back a mutable reference to the value

Because you get a reference, you write `*c += 1` to change the number inside.
---
Looping over every pair:

```rust
for (name, count) in &counts {
    println!("{name}: {count}");
}
```

Careful: a HashMap has **no fixed order**. Run the program twice and the pairs may come out in different orders. If order matters, collect the keys into a Vec and sort them.

`counts.len()` tells you how many keys there are.
'''


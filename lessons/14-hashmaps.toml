solution = '''
use std::collections::HashMap;

fn count_words(text: &str) -> HashMap<String, u32> {
    let mut counts = HashMap::new();
    for word in text.split_whitespace() {
        let c = counts.entry(word.to_string()).or_insert(0);
        *c += 1;
    }
    counts
}

fn count_of(map: &HashMap<String, u32>, word: &str) -> u32 {
    match map.get(word) {
        Some(n) => *n,
        None => 0,
    }
}

fn total_words(map: &HashMap<String, u32>) -> u32 {
    let mut total = 0;
    for (_word, count) in map {
        total += count;
    }
    total
}

fn add_shells(map: &mut HashMap<String, u32>, who: &str, n: u32) {
    let c = map.entry(who.to_string()).or_insert(0);
    *c += n;
}

fn main() {
    let counts = count_words("crab shell crab pearl crab");
    println!("crab: {}", count_of(&counts, "crab"));
    println!("total: {}", total_words(&counts));
    let mut tally = HashMap::new();
    add_shells(&mut tally, "Pinch", 4);
    add_shells(&mut tally, "Pinch", 2);
    println!("Pinch: {}", count_of(&tally, "Pinch"));
}
'''

hints = [
  "`count_words`: start with `let mut counts = HashMap::new();`, loop `for word in text.split_whitespace()`, and return `counts` at the end.",
  "Inside the loop: `let c = counts.entry(word.to_string()).or_insert(0);` then `*c += 1;`. `add_shells` uses the same two lines, but adds `n` and uses `who`.",
  "`count_of`: `match map.get(word) { Some(n) => *n, None => 0 }`. `total_words`: `let mut total = 0; for (_word, count) in map { total += count; } total`.",
]

success = "Tally complete! A HashMap stores key and value pairs. `get` returns an Option, `entry().or_insert()` is the counting trick, and loops give pairs in no guaranteed order."

[check]
tests = '''
#[test]
fn counts_each_word() {
    let m = count_words("crab shell crab pearl crab");
    assert_eq!(m.len(), 3, "there are 3 different words, so the map needs 3 keys");
    assert_eq!(m.get("crab"), Some(&3), "crab appears 3 times");
    assert_eq!(m.get("shell"), Some(&1), "shell appears once");
}

#[test]
fn empty_text_gives_empty_map() {
    assert_eq!(count_words("").len(), 0, "no words means an empty map");
}

#[test]
fn count_of_finds_and_misses() {
    let m = count_words("a b a");
    assert_eq!(count_of(&m, "a"), 2, "a appears twice");
    assert_eq!(count_of(&m, "zzz"), 0, "a missing word should give 0");
}

#[test]
fn totals_add_up() {
    let m = count_words("x y x z x y");
    assert_eq!(total_words(&m), 6, "6 words in total");
}

#[test]
fn shells_accumulate() {
    let mut m: HashMap<String, u32> = HashMap::new();
    add_shells(&mut m, "Pinch", 4);
    add_shells(&mut m, "Sandy", 1);
    add_shells(&mut m, "Pinch", 2);
    assert_eq!(count_of(&m, "Pinch"), 6, "Pinch got 4 then 2, so 6");
    assert_eq!(count_of(&m, "Sandy"), 1, "Sandy got 1");
    assert_eq!(m.len(), 2, "only two names were added");
}
'''


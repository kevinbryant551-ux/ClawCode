tests = '''
#[test]
fn sum_to_small() {
    assert_eq!(sum_to(1), 1, "sum_to(1) should be 1");
    assert_eq!(sum_to(4), 10, "sum_to(4) should be 1+2+3+4 = 10");
}

#[test]
fn sum_to_bigger_and_zero() {
    assert_eq!(sum_to(100), 5050, "sum_to(100) should be 5050");
    assert_eq!(sum_to(0), 0, "sum_to(0) should be 0 (nothing to add)");
}

#[test]
fn doublings_count() {
    assert_eq!(doublings(10), 4, "doublings(10): 1,2,4,8,16 is 4 doublings");
    assert_eq!(doublings(1), 1, "doublings(1): 1 is <= 1 so double once to 2");
    assert_eq!(doublings(0), 0, "doublings(0): 1 is already above 0, so 0 doublings");
}
'''


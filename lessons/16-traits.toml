id = "16-traits"
order = 16
chapter = "Superpowers"
title = "Shared Superpowers"
xp = 110
concepts = ["trait", "impl Trait for", "default method", "&impl Trait", "#[derive]", "Debug", "Clone", "PartialEq"]

intro = '''
# Traits: a promise of skills

Crabs click. Octopuses blub. Different animals, but both can **speak**. A trait lets you say "anything that can speak must have these methods", and then write code that works with every speaker.

trait :: a list of methods a type promises to have
impl Trait for Type :: the block where a type keeps that promise
default method :: a trait method that already has a body, so types may skip it
---
Here is a trait with one required method and one default method.

```rust
trait Speak {
    fn sound(&self) -> String;          // required

    fn shout(&self) -> String {         // default
        self.sound().to_uppercase()
    }
}

struct Cat;

impl Speak for Cat {
    fn sound(&self) -> String {
        "meow".to_string()
    }
}
```

`Cat` only wrote `sound`. It got `shout` for free, and `Cat.shout()` gives `"MEOW"`. A type may also write its own version of a default method to override it.
---
Now the payoff. A function can accept **any** type that keeps the promise:

```rust
fn announce(x: &impl Speak) -> String {
    format!("Listen: {}", x.sound())
}
```

Read `&impl Speak` as "a borrowed something that implements Speak". Pass a `Cat`, a `Dog`, anything with the trait. One function, many types.

impl Trait :: in a parameter, "any type that has this trait"

> Pinch tip: `&impl Speak` is the friendly way to write this. You will meet fancier spellings later, but they all mean the same idea.
---
Some traits are so common that Rust writes them for you. Put `#[derive(...)]` above a struct:

```rust
#[derive(Debug, Clone, PartialEq)]
struct Crab {
    name: String,
}
```

Debug :: lets you print the value with `{:?}`
Clone :: lets you make a copy with `.clone()`
PartialEq :: lets you compare two values with `==`

Without the derive, `a == b` on your own struct will not compile.
'''

goal = "Fill in the Speak trait's default method, implement Speak for Crab and Octopus, write describe, and derive Debug, Clone and PartialEq on Crab."


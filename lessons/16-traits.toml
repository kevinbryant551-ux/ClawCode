[[quiz]]
after_card = 2
question = '''
What does this print?
```rust
trait Hi {
    fn hi(&self) -> String {
        "hi".to_string()
    }
}
struct A;
impl Hi for A {}

fn main() {
    println!("{}", A.hi());
}
```
'''
choices = ["Nothing, it will not compile", "hi", "A", "It panics"]
answer = 1
explain = "`A` kept the promise with an empty impl, and `hi` is a default method, so A gets it for free."

[[quiz]]
after_card = 3
question = "In `fn describe(x: &impl Speak)`, what does `&impl Speak` mean?"
choices = ["x is a Speak struct", "x is a borrowed value of any type that implements Speak", "x is a trait that needs a body", "x can be anything at all"]
answer = 1
explain = "It accepts any type that implements the trait, borrowed. Types without the trait are rejected by the compiler."


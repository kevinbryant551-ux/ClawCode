solution = '''
trait Speak {
    fn name(&self) -> String;
    fn sound(&self) -> String;

    fn speak(&self) -> String {
        format!("{} says {}", self.name(), self.sound())
    }
}

#[derive(Debug, Clone, PartialEq)]
struct Crab {
    name: String,
}

struct Octopus {
    name: String,
    arms: u32,
}

impl Speak for Crab {
    fn name(&self) -> String {
        self.name.clone()
    }
    fn sound(&self) -> String {
        "click".to_string()
    }
}

impl Speak for Octopus {
    fn name(&self) -> String {
        self.name.clone()
    }
    fn sound(&self) -> String {
        "blub".to_string()
    }
}

fn describe(x: &impl Speak) -> String {
    format!("[{}]", x.speak())
}

fn main() {
    let c = Crab { name: "Pinch".to_string() };
    let o = Octopus { name: "Inky".to_string(), arms: 8 };
    println!("{}", describe(&c));
    println!("{}", describe(&o));
    println!("{:?} has a twin: {}", c, c == c.clone());
    println!("Inky has {} arms", o.arms);
}
'''

hints = [
  "Start with the default method. Inside a trait you can call the other trait methods on `self`: `self.name()` and `self.sound()`. Combine them with `format!`.",
  "`speak` is `format!(\"{} says {}\", self.name(), self.sound())`. For the impls, `name` can return `self.name.clone()` and `sound` returns a string like `\"click\".to_string()`.",
  "`describe` is `format!(\"[{}]\", x.speak())`. For the derive, write `#[derive(Debug, Clone, PartialEq)]` on the line right above `struct Crab`.",
]

success = "Superpower unlocked! A trait is a promise of methods, `impl Trait for Type` keeps it, default methods come free, `&impl Trait` accepts any keeper, and `#[derive]` writes common traits for you."

[check]
tests = '''
#[test]
fn crab_speaks() {
    let c = Crab { name: "Pinch".to_string() };
    assert_eq!(c.speak(), "Pinch says click", "Crab's speak() should be \"Pinch says click\"");
}

#[test]
fn octopus_speaks() {
    let o = Octopus { name: "Inky".to_string(), arms: 8 };
    assert_eq!(o.speak(), "Inky says blub", "Octopus's speak() should be \"Inky says blub\"");
}

#[test]
fn describe_takes_any_speaker() {
    let c = Crab { name: "Pinch".to_string() };
    let o = Octopus { name: "Inky".to_string(), arms: 8 };
    assert_eq!(describe(&c), "[Pinch says click]", "describe should wrap speak() in square brackets");
    assert_eq!(describe(&o), "[Inky says blub]", "describe should work for Octopus too");
}

#[test]
fn crab_derives_work() {
    let c = Crab { name: "Pinch".to_string() };
    let twin = c.clone();
    assert!(c == twin, "a cloned Crab should be equal to the original (PartialEq + Clone)");
    assert!(format!("{:?}", c).contains("Pinch"), "Debug output should show the name");
}

'''


id = "02-variables"
order = 2
chapter = "Getting Started"
title = "Keeping Things in Buckets"
xp = 60
concepts = ["let", "mut", "immutability", "{} placeholders", "shadowing"]

intro = '''
# Variables

A variable is a labelled bucket that holds a value, so you can use it again later.

let :: creates a new variable. `let lives = 3;` puts the value 3 in a bucket named `lives`.
mut :: short for "mutable". It allows a variable's value to change later.
shadowing :: making a brand new variable with the same name using `let` again. The new one hides the old one.

---
Here is the surprising part: in Rust, variables **cannot change by default**.

```rust
fn main() {
    let coins = 5;
    println!("Coins: {}", coins);

    let mut steps = 0;
    steps = steps + 1;
    println!("Steps: {}", steps);
}
```

`coins` is locked. If you wrote `coins = 6;` the compiler would refuse (error E0384). `steps` has `mut`, so changing it is fine.

---
The `{}` inside `println!` is a placeholder. Rust swaps it for the value of the variable listed after the text.

So `println!("Steps: {}", steps);` prints `Steps: 1`. Use one `{}` for each value you list.

---
Shadowing looks like this:

```rust
let size = 3;
let size = size + 1; // a new variable, now 4
```

Your turn: the starter tries to change a locked variable, so it won't compile. Read the error message, then unlock the variable.

> Pinch tip: locked-by-default is a safety feature. When you see `mut`, you know that value is going to change somewhere.
'''

goal = 'Fix the program so it compiles and prints "Lives: 3" followed by "Lives: 2", by making the variable mutable.'

starter = '''
fn main() {
    let lives = 3;
    println!("Lives: {}", lives);

    lives = 2;
    println!("Lives: {}", lives);
}
'''

solution = '''
fn main() {
    let mut lives = 3;
    println!("Lives: {}", lives);

    lives = 2;
    println!("Lives: {}", lives);
}
'''

hints = [
  "Run it and read the error. It mentions assigning twice to an immutable variable.",
  "The variable `lives` is locked. There is a keyword that unlocks a variable.",
  "Change the first line to `let mut lives = 3;`.",
]

success = "Nicely done! Variables are locked unless you say `mut`. Rust makes you opt in to change, which keeps surprises away."

[check]
expected_output = '''
Lives: 3
Lives: 2
'''

[[check.must_contain]]
text = "mut"
why = "This lesson is about `mut`, so make the variable mutable."

[[quiz]]
after_card = 1
question = '''
Which keyword lets a variable's value change later?
'''
choices = ["fn", "let", "shadowing", "mut"]
answer = 3
explain = "`mut` (mutable) opts a variable in to changing. `let` only creates the variable."

[[quiz]]
after_card = 2
question = '''
Spot the bug! Why does the compiler refuse this?
```rust
fn main() {
    let score = 10;
    score = score + 5;
    println!("{}", score);
}
```
'''
choices = ["Nothing is wrong, it prints 15", "score is not mut, so it can't be changed", "println! needs two arguments", "You can't use + on variables"]
answer = 1
explain = "Variables are locked by default. Writing `let mut score = 10;` fixes error E0384."

[[quiz]]
after_card = 4
question = '''
What does this print?
```rust
fn main() {
    let size = 3;
    let size = size + 1;
    let size = size * 2;
    println!("{}", size);
}
```
'''
choices = ["3", "4", "8", "It doesn't compile"]
answer = 2
explain = "Each `let` shadows the last: 3, then 4, then 4 * 2 = 8. Shadowing is allowed even without `mut`."

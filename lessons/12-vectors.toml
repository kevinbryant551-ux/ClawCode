id = "12-vectors"
order = 12
chapter = "Collections"
title = "Bucket of Shells"
xp = 90
concepts = ["Vec<T>", "vec!", "push", "len", "indexing", ".get()", "for over &v", "for over &mut v"]

intro = '''
# One bucket, many shells

Until now each variable held one thing. What if you find 50 shells on the beach? You need a bucket!

A **Vec** is a growable list that holds many values of the same type.

Vec :: a growable list of values that all have the same type, written `Vec<i32>`
vec! :: a macro that builds a Vec from values you list
push :: a method that adds one item to the end of a Vec
index :: the position of an item, counting from 0
---
Here is a bucket in action:

```rust
let mut shells = vec![3, 8, 5];
shells.push(10);
println!("{}", shells.len());   // 4
println!("{}", shells[0]);      // 3
```

`vec![...]` makes the list. `push` needs `mut`, because the bucket changes. `len()` tells you how many items are inside.

You can also start empty with `Vec::new()` and push as you go. Rust figures out the type from what you push in.

> Pinch tip: indexes start at 0, so the first shell is `shells[0]` and the last of four is `shells[3]`.
---
**Danger zone!** What if you ask for `shells[99]` and there are only 4? The program **panics** and crashes.

The safe way is `.get(99)`. It returns an `Option`: `Some(&value)` if the spot exists, or `None` if not.

```rust
match shells.get(99) {
    Some(n) => println!("found {n}"),
    None => println!("nothing there"),
}
```

Option :: you met it before! `get` uses it to say "maybe there is a value here"

Use `[]` when you are sure the spot exists. Use `.get()` when you are not.
---
To visit every item, use `for`. Borrow the Vec with `&` so you can use it again afterwards:

```rust
let mut sum = 0;
for s in &shells {
    sum += s;
}
```

To **change** each item, borrow mutably with `&mut`. Then `s` is a reference, and you write `*s` to reach the value inside:

```rust
for s in &mut shells {
    *s += 1;
}
```

`*s` means "the thing `s` points at". Functions can take `&Vec<i32>` to look at a list or `&mut Vec<i32>` to change it.

> Pinch tip: a plain `for s in shells` would move the whole Vec away. Add `&` to keep it!
'''

goal = "Implement total (sum of the Vec), first_or_zero (first item, or 0 if empty, using .get), double_all (double every item in place) and countdown (a Vec from n down to 1)."

starter = '''

solution = '''
fn total(v: &Vec<i32>) -> i32 {
    let mut sum = 0;
    for n in v {
        sum += n;
    }
    sum
}

fn first_or_zero(v: &Vec<i32>) -> i32 {
    match v.get(0) {
        Some(n) => *n,
        None => 0,
    }
}

fn double_all(v: &mut Vec<i32>) {
    for n in v {
        *n *= 2;
    }
}

fn countdown(n: i32) -> Vec<i32> {
    let mut out = Vec::new();
    let mut i = n;
    while i > 0 {
        out.push(i);
        i -= 1;
    }
    out
}

fn main() {
    let mut shells = vec![3, 8, 5];
    shells.push(10);
    double_all(&mut shells);
    println!("total {}, first {}", total(&shells), first_or_zero(&shells));
    println!("{:?}", countdown(3));
}
'''

hints = [
  "`total`: make `let mut sum = 0;`, then `for n in v { sum += n; }` (v is already a borrow), and end the function with `sum`.",
  "`first_or_zero`: `match v.get(0) { Some(n) => *n, None => 0 }`. The `*` turns the reference `&i32` into a plain `i32`.",
  "`double_all`: `for n in v { *n *= 2; }`. `countdown`: start with `let mut out = Vec::new();` then push `n`, `n - 1`, ... down to 1 using a `while` loop, and return `out`.",
]

success = "Bucket full! A Vec holds many values of one type. Use [] when you're sure, .get() when you're not, `for x in &v` to look and `for x in &mut v` to change."

[check]
tests = '''
#[test]
fn total_adds_everything() {
    assert_eq!(total(&vec![1, 2, 3, 4]), 10, "1 + 2 + 3 + 4 should be 10");
}

#[test]
fn total_of_empty_is_zero() {
    assert_eq!(total(&Vec::new()), 0, "an empty Vec adds up to 0");
}

#[test]
fn first_item_found() {
    assert_eq!(first_or_zero(&vec![7, 8, 9]), 7, "the first item of [7, 8, 9] is 7");
}

#[test]
fn first_item_missing() {
    assert_eq!(first_or_zero(&Vec::new()), 0, "an empty Vec should give 0, not crash");
}

#[test]
fn doubling_changes_the_vec() {
    let mut v = vec![1, 5, -2];
    double_all(&mut v);
    assert_eq!(v, vec![2, 10, -4], "every item should be doubled in place");
}

#[test]
fn countdown_builds_a_list() {
    assert_eq!(countdown(4), vec![4, 3, 2, 1], "countdown(4) should be [4, 3, 2, 1]");
    assert_eq!(countdown(0), Vec::<i32>::new(), "countdown(0) should be empty");
}
'''

[[quiz]]
after_card = 2
question = '''
What does this print?
```rust
let mut v = vec![10, 20];
v.push(30);
println!("{} {}", v.len(), v[1]);
```
'''
choices = ["2 10", "3 20", "3 30", "2 20"]
answer = 1
explain = "After the push there are 3 items, so len is 3. Indexes start at 0, so v[1] is the second item: 20."

[[quiz]]
after_card = 3
question = '''
A Vec has 3 items. What does `v.get(5)` give back?
'''
choices = ["A panic and crash", "0", "None", "The last item"]
answer = 2
explain = "`.get()` never panics. Out of range gives `None`. Only `v[5]` would crash the program."

[[quiz]]
after_card = 4
question = '''
Which loop adds 1 to every number inside `v`?
'''
choices = [
  "for n in v { n += 1; }",
  "for n in &mut v { *n += 1; }",
  "for n in &v { *n += 1; }",
  "for n in &v { n + 1; }",
]
answer = 1
explain = "You need `&mut v` to be allowed to change items, and `*n` to reach the value behind the reference."


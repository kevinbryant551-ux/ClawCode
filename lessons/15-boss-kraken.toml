solution = '''
use std::collections::HashMap;

fn parse_catch(text: &str) -> Vec<String> {
    let mut out = Vec::new();
    for word in text.split_whitespace() {
        out.push(word.to_lowercase());
    }
    out
}

fn tally(items: &Vec<String>) -> HashMap<String, u32> {
    let mut map = HashMap::new();
    for item in items {
        let c = map.entry(item.to_string()).or_insert(0);
        *c += 1;
    }
    map
}

fn count_of(map: &HashMap<String, u32>, item: &str) -> u32 {
    match map.get(item) {
        Some(n) => *n,
        None => 0,
    }
}

fn biggest(v: &Vec<u32>) -> Option<u32> {
    let mut best: Option<u32> = None;
    for &n in v {
        match best {
            Some(b) if b >= n => {}
            _ => best = Some(n),
        }
    }
    best
}

fn bump_all(v: &mut Vec<u32>) {
    for n in v {
        *n += 1;
    }
}

fn banner(items: &Vec<String>) -> String {
    let mut out = String::new();
    for item in items {
        if !out.is_empty() {
            out.push(',');
        }
        out.push_str(&item.to_uppercase());
    }
    out
}

fn shortest_name(items: &Vec<String>) -> Option<usize> {
    let mut best: Option<usize> = None;
    for item in items {
        let len = item.len();
        match best {
            Some(b) if b <= len => {}
            _ => best = Some(len),
        }
    }
    best
}

fn main() {
    let catch = parse_catch("Crab  SHELL crab");
    let counts = tally(&catch);
    println!("crabs: {}", count_of(&counts, "crab"));
    println!("{}", banner(&catch));
}
'''

hints = [

  "`biggest` and `shortest_name` both track a best value so far: `let mut best = None;` then for each item decide whether to replace it with `Some(item)`. An empty Vec never replaces it, so `None` comes out. (`bump_all` adds 1 to each: `*n += 1;`.)",
  "`banner`: `let mut out = String::new();` then for each item `if !out.is_empty() { out.push(','); }` followed by `out.push_str(&item.to_uppercase());`, and return `out`.",
]


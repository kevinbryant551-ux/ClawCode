[check]
tests = '''
fn strings(v: &[&str]) -> Vec<String> {
    v.iter().map(|s| s.to_string()).collect()
}

#[test]
fn parse_splits_and_lowercases() {
    assert_eq!(
        parse_catch("Crab  SHELL crab"),
        strings(&["crab", "shell", "crab"]),
        "parse_catch should split on whitespace and lowercase each word"
    );
    assert_eq!(parse_catch("   ").len(), 0, "only spaces means no words");
}

#[test]
fn tally_counts() {
    let m = tally(&strings(&["a", "b", "a", "a"]));
    assert_eq!(m.len(), 2, "two different items means two keys");
    assert_eq!(m.get("a"), Some(&3), "a appears 3 times");
    assert_eq!(m.get("b"), Some(&1), "b appears once");
}

#[test]
fn count_of_defaults_to_zero() {
    let m = tally(&strings(&["x", "x"]));
    assert_eq!(count_of(&m, "x"), 2, "x appears twice");
    assert_eq!(count_of(&m, "nope"), 0, "a missing item should count as 0");
}

#[test]
fn biggest_finds_max() {
    assert_eq!(biggest(&vec![3, 9, 4]), Some(9), "the biggest of [3, 9, 4] is 9");
    assert_eq!(biggest(&vec![5]), Some(5), "a single item is the biggest");
}

#[test]
fn biggest_of_nothing() {
    assert_eq!(biggest(&Vec::new()), None, "an empty Vec has no biggest, so None");
}

#[test]
fn adds_one_in_place() {
    let mut v = vec![0, 4, 9];
    bump_all(&mut v);
    assert_eq!(v, vec![1, 5, 10], "every number should go up by 1");
}

#[test]
fn banner_joins_loudly() {
    assert_eq!(banner(&strings(&["crab", "pearl"])), "CRAB,PEARL", "expected \"CRAB,PEARL\"");
    assert_eq!(banner(&strings(&["solo"])), "SOLO", "one item needs no comma");
    assert_eq!(banner(&Vec::new()), "", "no items gives an empty String");
}

#[test]
fn shortest_name_works() {
    assert_eq!(shortest_name(&strings(&["octopus", "eel", "crab"])), Some(3), "eel is the shortest at 3 letters");
    assert_eq!(shortest_name(&Vec::new()), None, "no names means None");
}
'''

[[quiz]]
after_card = 1
question = '''
What does this print?
```rust
let mut v = vec![4, 8];
v.push(1);
match v.get(3) {
    Some(n) => println!("{n}"),
    None => println!("none"),
}
```
'''
choices = ["1", "8", "none", "It panics"]
answer = 2
explain = "The Vec has 3 items, so valid indexes are 0, 1 and 2. `get(3)` is out of range and safely gives `None`."

[[quiz]]
after_card = 1
question = '''
Which line adds 1 to the count for `word`, creating it at 0 if new?
'''
choices = [
  "*map.entry(word.to_string()).or_insert(0) += 1;",
  "map.insert(word, map.get(word) + 1);",
  "map[word] += 1;",
  "map.push(word);",
]
answer = 0
explain = "`entry(...).or_insert(0)` returns a mutable reference to the value, creating it at 0 if missing. The `*` lets you add to it."


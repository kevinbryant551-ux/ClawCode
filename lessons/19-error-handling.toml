intro = '''
# Errors you design yourself

`Result<T, E>` says "I will give you a `T`, or an `E` explaining what went wrong". Until now `E` was a plain `String`. Better: make an **enum** with one variant per kind of problem.

```rust
#[derive(Debug, PartialEq)]
enum CrabError {
    Empty,
    NotANumber,
    TooBig(u32),
}
```

custom error :: your own enum that lists the ways something can fail
---
A function that can fail returns `Result<T, MyError>`. Return `Ok(value)` for success and `Err(MyError::...)` for failure.

```rust
fn half(n: u32) -> Result<u32, CrabError> {
    if n > 100 {
        return Err(CrabError::TooBig(n));
    }
    Ok(n / 2)
}
```

Callers can then `match` and handle each case. No crashes, no mystery.
---
Calling another function that returns `Result` can get wordy. The `?` operator does the boring part: on `Ok(v)` it gives you `v`, on `Err(e)` it **returns that error from your function right away**.

```rust
fn quarter(n: u32) -> Result<u32, CrabError> {
    let h = half(n)?;   // Err? leave early. Ok? carry on.
    half(h)
}
```

? :: unwrap an Ok, or return the Err to the caller immediately

> Pinch tip: `?` only works inside a function that itself returns a `Result`. It is a shortcut for a `match` with an early `return`.
---
To print an error with `{}`, give it a friendly message by implementing `Display`.

```rust
use std::fmt;

impl fmt::Display for CrabError {
    fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
        match self {
            CrabError::Empty => write!(f, "nothing here"),
            CrabError::NotANumber => write!(f, "not a number"),
            CrabError::TooBig(n) => write!(f, "{} is too big", n),
        }
    }
}
```

Display :: the trait behind `{}` printing, and behind `.to_string()`
write! :: like `println!`, but writes into `f` instead of the screen
'''


[[quiz]]
after_card = 3
question = '''
What does this print?
```rust
fn f(s: &str) -> Result<i32, String> {
    let n: i32 = match s.parse() {
        Ok(n) => n,
        Err(_) => return Err("bad".to_string()),
    };
    Ok(n + 1)
}
fn g(s: &str) -> Result<i32, String> {
    let a = f(s)?;
    println!("after");
    Ok(a * 2)
}
fn main() {
    println!("{:?}", g("x"));
}
```
'''
choices = ["after, then Err(\"bad\")", "Ok(0)", "Err(\"bad\")", "It panics"]
answer = 2
explain = "f fails, so `?` returns the Err from g immediately. The println of \"after\" never runs."

[[quiz]]
after_card = 3
question = "Where is the `?` operator allowed?"
choices = ["Anywhere", "Only in a function that itself returns a Result (or Option)", "Only inside main", "Only in match arms"]
answer = 1
explain = "`?` may need to return an Err from the current function, so that function's return type must be able to hold one."


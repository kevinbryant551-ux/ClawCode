solution = '''
use std::fmt;

#[derive(Debug, PartialEq)]
enum CrabError {
    Empty,
    NotANumber,
    TooBig(u32),
}

impl fmt::Display for CrabError {
    fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
        match self {
            CrabError::Empty => write!(f, "empty input"),
            CrabError::NotANumber => write!(f, "not a number"),
            CrabError::TooBig(n) => write!(f, "{} is too big (max 100)", n),
        }
    }
}

fn parse_shells(text: &str) -> Result<u32, CrabError> {
    let text = text.trim();
    if text.is_empty() {
        return Err(CrabError::Empty);
    }
    let n = match text.parse::<u32>() {
        Ok(n) => n,
        Err(_) => return Err(CrabError::NotANumber),
    };
    if n > 100 {
        return Err(CrabError::TooBig(n));
    }
    Ok(n)
}

fn total_shells(a: &str, b: &str) -> Result<u32, CrabError> {
    let x = parse_shells(a)?;
    let y = parse_shells(b)?;
    Ok(x + y)
}

fn report(a: &str, b: &str) -> String {
    match total_shells(a, b) {
        Ok(n) => format!("Total: {}", n),
        Err(e) => format!("Error: {}", e),
    }
}

fn main() {
    println!("{}", report("3", "4"));
    println!("{}", report("3", "x"));
    println!("{}", report("", "4"));
    println!("{}", report("500", "4"));
}
'''

hints = [
  "Start with the Display messages: `write!(f, \"empty input\")`. For TooBig, put the number in: `write!(f, \"{} is too big (max 100)\", n)`.",
  "In `parse_shells`: `let text = text.trim();`, return `Err(CrabError::Empty)` if `text.is_empty()`, then `match text.parse::<u32>() { Ok(n) => n, Err(_) => return Err(CrabError::NotANumber) }`, then check `n > 100`.",
  "`total_shells` is `let x = parse_shells(a)?; let y = parse_shells(b)?; Ok(x + y)`. `report` is a `match total_shells(a, b)` with `Ok(n) => format!(\"Total: {}\", n)` and `Err(e) => format!(\"Error: {}\", e)`.",
]

success = "Error handling mastered! A custom enum names each failure, Result carries it, `?` passes it up in one character, Display makes it friendly, and `match` decides what to do at the end."

[check]
tests = '''
#[test]
fn good_numbers_parse() {
    assert_eq!(parse_shells("42"), Ok(42), "\"42\" should parse to Ok(42)");
    assert_eq!(parse_shells("  7 "), Ok(7), "spaces around the number should be trimmed");
}

#[test]
fn bad_input_gives_errors() {
    assert_eq!(parse_shells(""), Err(CrabError::Empty), "empty text should be Err(Empty)");
    assert_eq!(parse_shells("   "), Err(CrabError::Empty), "only spaces should be Err(Empty)");
    assert_eq!(parse_shells("abc"), Err(CrabError::NotANumber), "\"abc\" should be Err(NotANumber)");
    assert_eq!(parse_shells("101"), Err(CrabError::TooBig(101)), "101 should be Err(TooBig(101))");
    assert_eq!(parse_shells("100"), Ok(100), "100 is allowed");
}

#[test]
fn total_adds_and_passes_errors_up() {
    assert_eq!(total_shells("3", "4"), Ok(7), "3 + 4 should be Ok(7)");
    assert_eq!(total_shells("x", "4"), Err(CrabError::NotANumber), "the first error should be passed up");
    assert_eq!(total_shells("4", "999"), Err(CrabError::TooBig(999)), "the second error should be passed up");
}

#[test]
fn errors_have_friendly_messages() {
    assert_eq!(CrabError::Empty.to_string(), "empty input", "Display for Empty");
    assert_eq!(CrabError::NotANumber.to_string(), "not a number", "Display for NotANumber");
    assert_eq!(CrabError::TooBig(500).to_string(), "500 is too big (max 100)", "Display for TooBig(500)");
}

#[test]
fn report_matches_on_the_result() {
    assert_eq!(report("3", "4"), "Total: 7", "success report");
    assert_eq!(report("", "4"), "Error: empty input", "error report");
    assert_eq!(report("500", "4"), "Error: 500 is too big (max 100)", "error report with a number");
}

'''

